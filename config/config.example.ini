# Python 3.8+; all times below are seconds.
[interfaces]
upstream = auto
# Comma-separated names, no spaces; overrides useful before a first successful join.
downstream = auto

[igmp]
# auto: require recent upstream v2 query. v2: explicit ASM provider override.
# off: observe only. v1/v3 upstream queries or source-filter/SSM block BOTH auto/v2.
force_version = auto
# Sends a v2 General Query if v2 is permitted and an active routed ASM group
# has no client report for this long, after any external Query response window.
query_downstream = fallback
fallback_after_seconds = 150
stale_group_seconds = 300
query_evidence_seconds = 400
traffic_grace_seconds = 90

[general]
# auto = shortest downstream bridge membership interval / 4, clamped 10..60s.
# Missing bridge timer: 260s assumption -> 60s. Explicit range: 10..120s.
refresh_interval = auto
scan_interval = 5
heartbeat_interval = 3600
log_path = /data/unifi-btv/unifi-btv.log
state_path = /run/unifi-btv/status.json

[clients]
# Optional comma-separated MAC allowlist. Safety evidence ignores this filter.
macs = auto
